name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv lock --check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen mypy strix/

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - run: uv run --frozen bandit -r strix/ -c pyproject.toml

  # pytest intentionally not run in CI on this fork (personal repo; no test
  # suite execution in Actions). Run `uv run pytest` locally instead.
